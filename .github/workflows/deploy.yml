name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend/rag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./Frontend/rag/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        env:
          CI: true
        run: npm test

  build:
    name: Build React App
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend/rag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./Frontend/rag/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build
        env:
          # This injects your API key from GitHub Secrets into the build
          REACT_APP_API_KEY: ${{ secrets.API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend/rag/build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
