services:
  # ── Node.js Backend (RAG API) ───────────────────────────────────────────────
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    healthCheckPath: /status

    envVars:
      # Nvidia API Key — set this in the Render Dashboard (keep it secret)
      - key: API_KEY
        sync: false

      # ── Chroma Cloud credentials ──────────────────────────────────────────
      # From your trychroma.com dashboard
      - key: CHROMA_API_KEY
        sync: false   # paste: ck-7NA27N1jTJD...

      - key: CHROMA_TENANT
        sync: false   # paste: 93f2f1c8-ff50-4e73-8736-8fb8902a20cf

      - key: CHROMA_DATABASE
        value: Rag_Production

      # Upload directory — /tmp is writable on Render free tier
      - key: UPLOAD_DIR
        value: /tmp/pdf_storage

      - key: NODE_ENV
        value: production
